name: Build wheel and publish release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13", "3.14"]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: invshare_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'endstone>=0.11.15,<0.11.16' PyMySQL pycryptodome pytest ruff
      - name: Run lifecycle and MariaDB regression tests
        env:
          INVSHARE_TEST_PORT: "3306"
          INVSHARE_TEST_PASSWORD: test-only-password
        run: python -m pytest -q
      - run: python -m ruff check src tests scripts native/conanfile.py hatch_build.py

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux_x86_64
            library: inventory_sync.so
          - os: windows-2022
            platform: win_amd64
            library: inventory_sync.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux Clang and libc++
        if: runner.os == 'Linux'
        uses: EndstoneMC/endstone/.github/actions/setup-clang@b4aaa87d2c5305e7d340168f824ac2e2ea722e44
        with:
          llvm-version: "20"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: KyleMayes/install-llvm-action@v2
        if: runner.os == 'Windows'
        with:
          version: "20.1.8"
      - run: python -m pip install 'conan>=2,<3' 'cmake>=3.29,<4' ninja build
      - run: conan remote add endstone https://conan.cloudsmith.io/endstone/conan/ --force
      - run: python scripts/build_native.py --output scratch/native
      - name: Package native wheel
        env:
          INVSHARE_NATIVE_LIBRARY: scratch/native/${{ matrix.library }}
        run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish platform wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; preserving its validated artifacts."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release upload "$GITHUB_REF_NAME" dist/*.whl
