[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-inventory-share-plugin"
version = "2.7.3"
description = "Multi server inventory share plugin for Endstone 0.11.6"
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.8,<0.12",
    "PyMySQL",
    "pycryptodome",
    "bedrock-protocol-packets-ng>=0.0.9"
]

[project.entry-points.endstone]
inventory-share-plugin = "endstone_inventory_share_plugin:InventorySharePlugin"