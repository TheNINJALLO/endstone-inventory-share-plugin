[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-inventory-share-plugin"
version = "2.7.8"
description = "Multi-server inventory sharing with native inventory synchronization for Endstone 0.11"
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.11,<0.11.13",
    "PyMySQL",
    "pycryptodome",
    "bedrock-protocol-packets-ng>=0.0.9"
]

[project.entry-points.endstone]
inventory-share-plugin = "endstone_inventory_share_plugin:InventorySharePlugin"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["mysql: requires the disposable MySQL/MariaDB test database"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# Keep the same correctness checks locally and on newer CI Ruff releases.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]
